[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mulpubcli"
version = "1.0.0"
description = "小红书/知乎/今日头条/网易号多平台 HTTP 原生自动化发布 CLI"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PySocks>=1.7",
    "Pillow>=10.0.0",
    "qrcode>=7.0",
    "curl_cffi>=0.7",
    "loguru>=0.7.0",
    "python-dotenv",
    "PyExecJS",
    "playwright>=1.45",
    "websockets>=17,<18",
]

[project.scripts]
mulpubcli = "mulpubcli.__main__:main_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mulpubcli*"]
